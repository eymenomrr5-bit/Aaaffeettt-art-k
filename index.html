<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sonsuz Kalp ve H</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #05020a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #title {
            position: absolute;
            top: 5%;
            width: 100%;
            text-align: center;
            color: #ffffff;
            font-size: 2.5rem;
            font-weight: 300;
            letter-spacing: 3px;
            text-shadow: 0 0 15px rgba(255, 105, 180, 0.9), 0 0 30px rgba(255, 20, 147, 0.6);
            pointer-events: none;
            z-index: 10;
        }
        #sub-title {
            position: absolute;
            top: 15%;
            width: 100%;
            text-align: center;
            color: #ffb6c1;
            font-size: 1rem;
            opacity: 0.8;
            font-style: italic;
            pointer-events: none;
            z-index: 10;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>

    <div id="title">Sonsuz Kalp</div>
    <div id="sub-title">Sadece Senin İçin...</div>

    <!-- Three.js ve OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // --- 1. Temel Kurulum ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 45);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 10;
        controls.maxDistance = 100;

        // --- 2. Ortak Ayarlar ---
        const colorChoices = ['#ff0055', '#ff1493', '#ff69b4', '#ffb6c1', '#ffffff', '#ffd7e0'];
        const parameters = { max: 0.01 }; // Maksimum hız

        // --- 3. Fonksiyon: Parçacık Oluşturma ---
        function createPoints(count, positionsFn, colorFn) {
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(count * 3);
            const colors = new Float32Array(count * 3);
            const scales = new Float32Array(count);
            const speeds = new Float32Array(count);

            for (let i = 0; i < count; i++) {
                // Koordinatları al
                const pos = positionsFn(i, count);
                positions[i * 3] = pos.x;
                positions[i * 3 + 1] = pos.y;
                positions[i * 3 + 2] = pos.z;

                // Renk ayarla
                const color = new THREE.Color(colorFn(i, count));
                colors[i * 3] = color.r;
                colors[i * 3 + 1] = color.g;
                colors[i * 3 + 2] = color.b;

                // Boyut ve Hız (görseldeki koddan esinlenildi)
                scales[i] = Math.random() * 0.35 + 0.1; // Minimum boyut 0.1
                speeds[i] = Math.random() * parameters.max;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            return geometry;
        }

        // --- 4. Şekillerin Geometrileri ---

        // A. Dış Büyük Kalp (Çerçeve)
        const outerHeartPositions = (i, count) => {
            const t = (i / count) * Math.PI * 2;
            const size = 18;
            let x = size * 16 * Math.pow(Math.sin(t), 3);
            let y = size * (13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
            let z = (Math.random() - 0.5) * 6; // Hacim ver
            // Rastgele dağılım ekle (görseldeki koddan esinlenildi)
            const scatter = 0.1;
            x += (Math.random() - 0.5) * scatter * size;
            y += (Math.random() - 0.5) * scatter * size;
            return { x, y: y + 2, z }; // Biraz yukarı kaldır
        };
        const outerHeartColor = () => colorChoices[Math.floor(Math.random() * colorChoices.length)];
        const outerHeartGeom = createPoints(8000, outerHeartPositions, outerHeartColor);

        // B. İç Küçük Kalp
        const innerHeartPositions = (i, count) => {
            const t = (i / count) * Math.PI * 2;
            const size = 6; // Daha küçük
            let x = size * 16 * Math.pow(Math.sin(t), 3);
            let y = size * (13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
            let z = (Math.random() - 0.5) * 4;
            // Rastgele dağılım ekle
            const scatter = 0.15;
            x += (Math.random() - 0.5) * scatter * size;
            y += (Math.random() - 0.5) * scatter * size;
            return { x, y: y + 2, z }; // Dış kalp ile aynı merkeze al
        };
        const innerHeartColor = () => colorChoices[Math.floor(Math.random() * 2)]; // Daha sıcak renkler
        const innerHeartGeom = createPoints(3000, innerHeartPositions, innerHeartColor);

        // C. Merkezdeki 'H' Harfi
        const letterHPositions = (i, count) => {
            const t = i / count;
            const size = 4;
            let x, y, z;
            if (t < 1/3) { // Sol dikey çizgi
                x = -size;
                y = (t * 3 - 0.5) * size * 2;
            } else if (t < 2/3) { // Sağ dikey çizgi
                x = size;
                y = ((t - 1/3) * 3 - 0.5) * size * 2;
            } else { // Yatay orta çizgi
                x = ((t - 2/3) * 3 - 0.5) * size * 2;
                y = 0;
            }
            z = (Math.random() - 0.5) * 2;
            // Hafif dalgalanma
            const ripple = 0.3;
            x += (Math.random() - 0.5) * ripple;
            y += (Math.random() - 0.5) * ripple;
            return { x, y: y + 2, z };
        };
        const letterHColor = () => '#ffffff'; // Saf beyaz
        const letterHGeom = createPoints(2000, letterHPositions, letterHColor);

        // --- 5. Nokta Materyalleri ve Objeleri ---

        // Parlak nokta dokusu
        function createParticleTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            gradient.addColorStop(0, 'rgba(255,255,255,1)');
            gradient.addColorStop(0.3, 'rgba(255,105,180,0.8)');
            gradient.addColorStop(0.8, 'rgba(255,20,147,0.2)');
            gradient.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 64, 64);
            return new THREE.CanvasTexture(canvas);
        }
        const particleTexture = createParticleTexture();

        // Ortak materyal ayarları (görseldeki koddan esinlenildi)
        const commonMatSettings = {
            size: 0.8,
            vertexColors: true,
            map: particleTexture,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            opacity: 0.9,
        };

        const outerHeartMat = new THREE.PointsMaterial({ ...commonMatSettings, size: 1.0, opacity: 0.7 });
        const innerHeartMat = new THREE.PointsMaterial({ ...commonMatSettings, size: 1.2, opacity: 0.9 });
        const letterHMat = new THREE.PointsMaterial({ ...commonMatSettings, size: 1.5, opacity: 1.0 });

        const outerHeart = new THREE.Points(outerHeartGeom, outerHeartMat);
        const innerHeart = new THREE.Points(innerHeartGeom, innerHeartMat);
        const letterH = new THREE.Points(letterHGeom, letterHMat);

        scene.add(outerHeart);
        scene.add(innerHeart);
        scene.add(letterH);

        // Arka plan yıldızları
        const starsGeometry = new THREE.BufferGeometry();
        const starsCount = 500;
        const starsPositions = new Float32Array(starsCount * 3);
        for(let i=0; i<starsCount*3; i++) {
            starsPositions[i] = (Math.random() - 0.5) * 200;
        }
        starsGeometry.setAttribute('position', new THREE.BufferAttribute(starsPositions, 3));
        const starsMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 0.2, transparent: true, opacity: 0.5 });
        const stars = new THREE.Points(starsGeometry, starsMaterial);
        scene.add(stars);

        // --- 6. Animasyon Döngüsü ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();

            // Yavaş dönüş
            outerHeart.rotation.y = elapsedTime * 0.05;
            innerHeart.rotation.y = elapsedTime * 0.1;
            letterH.rotation.y = elapsedTime * 0.2; // Harf daha hızlı dönsün

            // Nabız Hareketi (Kalp Atışı)
            const pulse = 1 + Math.sin(elapsedTime * 4) * 0.05;
            outerHeart.scale.set(pulse, pulse, pulse);
            const innerPulse = 1 + Math.sin(elapsedTime * 4.5) * 0.08;
            innerHeart.scale.set(innerPulse, innerPulse, innerPulse);
            const hPulse = 1 + Math.sin(elapsedTime * 5) * 0.1;
            letterH.scale.set(hPulse, hPulse, hPulse);

            // Yıldızların hafif hareketi
            stars.rotation.y = elapsedTime * 0.01;

            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        // --- 7. Pencere Boyutu Değişimi ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
